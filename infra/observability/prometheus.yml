global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["backend:9091"]

  - job_name: analytics
    static_configs:
      - targets: ["analytics:9091"]

  - job_name: postgres_exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
