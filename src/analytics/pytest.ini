[pytest]
asyncio_mode = auto
testpaths = tests
# The test suite mixes two import styles:
#   - `from analytics.X import Y` — expects src/ on sys.path
#   - `from detectors.X import Y` — expects src/analytics/ on sys.path
# CI runs pytest with CWD=src/analytics, so we add both (`.` and `..`)
# to keep both styles working without rewriting every import.
pythonpath = . ..
